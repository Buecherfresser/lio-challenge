name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - name: Typecheck backend
        run: |
          npm ci
          npm run typecheck
      - name: Build dashboard
        run: |
          npm --prefix web ci
          npm run web:build
