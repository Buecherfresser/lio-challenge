# Merge to main → CI → new app code on the VPS (data/ and .env are never touched; see deploy/deploy.sh).
# Needs repository secrets DEPLOY_SSH_KEY (private key, forced command on the server) and DEPLOY_KNOWN_HOSTS.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - name: Ship code to the VPS
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          git archive HEAD package.json package-lock.json tsconfig.json Dockerfile compose.yml .dockerignore \
              server shared prompts web .claude/skills deploy claude-bridge \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes root@178.104.40.53
