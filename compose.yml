name: lineguard

services:
  app:
    build: .
    image: lineguard:latest
    restart: always
    # Every setting from .env.example. On the server .env sits next to this file and is never touched by a deploy.
    env_file: .env
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      # Working database, archive and outbox (owned by uid 1000)
      - ./data:/data
    ports:
      # Loopback only. Public HTTPS for procurement.jonasdrechsel.com is the host Caddy in /opt/core.
      - "127.0.0.1:8101:8080"
    mem_limit: 1g

  # Claude Code behind an OpenAI-style endpoint, for testing and development (claude-bridge/). It only starts with
  # COMPOSE_PROFILES=claude in .env. The app uses it with LLM_PROVIDER=claude-code. Reachable only from the app.
  claude:
    build: ./claude-bridge
    image: lineguard-claude:latest
    profiles: [claude]
    restart: always
    environment:
      CLAUDE_CONCURRENCY: ${CLAUDE_CONCURRENCY:-3}
    volumes:
      # The Claude login and settings (owned by uid 1000)
      - ./claude-home:/home/node
      # Source files the app hands to an agent run, read-only
      - ./data/claude-files:/files:ro
    mem_limit: 2g
